# 재정 기록 안드로이드 앱 APK를 GitHub가 만든다(2026-11-02, 건강 기록 앱과 같은 방식). 컴퓨터에 설치할 것 없음.
name: android-apk

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # 서명 열쇠는 GitHub Secrets에서(업무·영성 기록 앱과 같은 방식, 2026-11-03 룡: 모든 기록 앱 동일).
      # KEYSTORE_B64 = p12 파일을 base64로, KEYSTORE_PASSWORD = 그 비밀번호, KEY_ALIAS = 열쇠 이름(없으면 budgetapp)
      - name: 서명 열쇠 꺼내기
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "GitHub Secrets에 KEYSTORE_B64가 없어요"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/budget.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/budget.p12" >> "$GITHUB_ENV"
      - name: APK 만들기
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle -p android :finkit:testReleaseUnitTest assembleRelease --no-daemon   # 알림 글자 읽기 시험(FinParseTest)도 같이
      - uses: actions/upload-artifact@v4
        with:
          name: faith-budget-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  # 가상 안드로이드 폰에 깔아서 실제로 켜 본다. 켜자마자 꺼지면 실패로 표시한다.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: faith-budget-apk
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app-release.apk
            adb logcat -c
            adb shell am start -W -n app.faithbudget/.MainActivity
            sleep 20
            adb logcat -d -b crash > crash.txt || true
            echo "===== crash ====="; cat crash.txt
            if grep -q "FATAL EXCEPTION" crash.txt; then exit 1; fi
            adb shell pidof app.faithbudget || { echo "앱이 꺼져 있어요"; exit 1; }
            echo "앱이 켜져 있어요"
            # 빠른 기록 창(위젯 − 지출과 같은 창)도 열려 보는지(2026-11-15 원본 한 벌 finkit으로 옮긴 뒤 확인)
            adb logcat -c
            adb shell am start -W -n app.faithbudget/.QuickActivity --es kind out
            sleep 10
            adb logcat -d -b crash > crash2.txt || true
            if grep -q "FATAL EXCEPTION" crash2.txt; then cat crash2.txt; exit 1; fi
            adb shell dumpsys activity activities | grep -E "topResumedActivity" | tee top.txt
            grep -q "app.faithbudget/.QuickActivity" top.txt || { echo "빠른 기록 창이 안 떴어요"; exit 1; }
            echo "빠른 기록 창 뜸"
            # 은행·카드 알림 → 「기록할까요?」(2026-11-16): 알림 읽기를 켜고 가짜 결제 알림을 띄워 우리 알림이 뜨는지 본다
            adb shell cmd notification allow_listener app.faithbudget/app.recordkit.fin.FinNotice
            adb shell pm grant app.faithbudget android.permission.POST_NOTIFICATIONS
            sleep 5
            adb logcat -c
            adb shell "cmd notification post -t 'TestBank' finpay1 'Cafe 5,600원 결제 잔액 123,456원'"
            adb shell "cmd notification post -t 'TestBank' finad1 '(광고) 9,900원 쿠폰 받았어요'"
            sleep 8
            adb shell dumpsys notification --noredact > noti.txt
            adb logcat -d -b crash > crash3.txt || true
            if grep -q "FATAL EXCEPTION" crash3.txt; then cat crash3.txt; exit 1; fi
            grep -a "기록할까요" noti.txt | head -5 || true
            grep -a -q "5,600원 지출" noti.txt || { echo "「기록할까요?」 알림이 안 떴어요"; grep -a -n "faithbudget" noti.txt | head -20; exit 1; }
            if grep -a -q "9,900원" noti.txt && grep -a "9,900원" noti.txt | grep -a -q "지출\|수입"; then echo "광고 알림을 잡았어요"; exit 1; fi
            echo "기록할까요 알림 뜸"
            # 알림을 눌렀을 때 열리는 창(안 적은 것이 채워진 빠른 기록 창)도 죽지 않는지
            adb logcat -c
            adb shell cmd statusbar expand-notifications
            sleep 3
            adb exec-out screencap -p > ask.png || true
            adb shell cmd statusbar collapse
            adb shell am start -W -n app.faithbudget/.QuickActivity --es kind out
            sleep 10
            adb exec-out screencap -p > quick.png || true
            adb logcat -d -b crash > crash4.txt || true
            if grep -q "FATAL EXCEPTION" crash4.txt; then cat crash4.txt; exit 1; fi
            # 「은행·카드 알림 켜기」 창(메뉴에서 여는 것과 같은 창)도 죽지 않는지: 시험용 표시를 붙여 연다
            adb logcat -c
            adb shell am start -W -n app.faithbudget/.MainActivity --ez notice_setup true
            sleep 8
            adb exec-out screencap -p > setup.png || true
            adb logcat -d -b crash > crash5.txt || true
            if grep -q "FATAL EXCEPTION" crash5.txt; then cat crash5.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: |
            ask.png
            quick.png
            setup.png
          if-no-files-found: ignore

  # main에서 가상 폰 확인까지 통과하면 APK를 사이트 app/에 올린다. 가족은 이 주소에서 받아 깐다.
  # 폰의 앱이 app/version.json을 보고 새 버전이면 스스로 받아서 업데이트한다(업무·영성 기록 앱과 같음).
  publish:
    needs: smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: faith-budget-apk
          path: dist
      - name: 사이트에 올리기
        run: |
          mkdir -p app
          cp dist/app-release.apk app/faith-budget.apk
          SHA=$(sha256sum app/faith-budget.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"apk":"/app/faith-budget.apk","sha256":"%s"}\n' "$GITHUB_RUN_NUMBER" "$SHA" > app/version.json
          git config user.name "faith-budget-bot"
          git config user.email "faith-budget-bot@users.noreply.github.com"
          git add -f app
          git commit -m "앱 새 버전 올림 (${GITHUB_RUN_NUMBER})"
          git pull --rebase -q origin main
          git push origin HEAD:main
      # 2026-11-16 룡 「바로 실시간」: 기록 앱 폰 기능이 바뀌면 라이프 RPG도 바로 새 버전(열쇠 RPG_DISPATCH가 있을 때만. 없으면 15분 점검이 대신)
      - name: 라이프 RPG도 바로 새 버전
        env:
          GH_TOKEN: ${{ secrets.RPG_DISPATCH }}
        run: |
          if [ -n "$GH_TOKEN" ]; then gh workflow run android.yml -R ggorotls-prog/life-rpg && echo "라이프 RPG 빌드 부름"; else echo "열쇠 없음 → 15분 점검이 대신"; fi
