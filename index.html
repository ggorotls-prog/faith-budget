<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f6f54">
<title>재정 기록</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1c2420;--sub:#6b756f;--line:#e2e5df;--main:#1f6f54;--soft:#e4f1eb;--in:#1b62b5;--insoft:#e3eefa;--bad:#c23b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
main{flex:1;min-height:0;display:none;flex-direction:column}
main.on{display:flex}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 0;color:var(--sub);font-weight:600}
nav button.on{color:var(--main)}
/* 기록 */
.top{display:flex;gap:8px;padding:10px 12px 0;align-items:center}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px}
.seg button{padding:7px 16px;border-radius:8px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--main)}
.seg button.on.in{color:var(--in)}
.date{margin-left:auto;background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600;position:relative}
.date input{position:absolute;inset:0;opacity:0;width:100%}
.amount{padding:6px 16px 2px;text-align:right;font-size:38px;font-weight:800;letter-spacing:-.5px;min-height:58px}
.amount.zero{color:#b5bbb6}
.amount.shake{animation:s .3s}
@keyframes s{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.memo{margin:0 12px 8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;width:calc(100% - 24px)}
.chips{flex:1;min-height:0;overflow:auto;padding:0 12px 8px}
.chips h4{margin:10px 0 6px;font-size:13px;color:var(--sub);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px}
.chip:active{background:var(--soft)}
.chip.fav{background:var(--soft);border-color:#bfe0d1}
.in .chip.fav{background:var(--insoft);border-color:#bcd5f2}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.keys button{background:var(--card);padding:13px 0;font-size:21px;font-weight:600}
.keys button:active{background:var(--soft)}
.keys .sm{font-size:16px;color:var(--sub)}
/* 내역·예산 */
.scroll{flex:1;min-height:0;overflow:auto;padding:0 12px 16px}
.month{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px;font-weight:700;font-size:17px}
.month button{padding:4px 14px;font-size:20px;color:var(--main)}
.day{margin:12px 0 4px;font-size:13px;color:var(--sub);font-weight:600}
.ent{display:flex;width:100%;text-align:left;background:var(--card);padding:11px 12px;border-bottom:1px solid var(--line);gap:10px;align-items:center}
.ent b{flex:none;font-weight:700}
.ent span{flex:1;min-width:0}
.ent small{display:block;color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .inc{color:var(--in)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border-radius:12px;padding:12px}
.tile small{color:var(--sub);font-size:13px;display:block}
.tile b{font-size:18px}
.tile.wide{grid-column:1/-1}
.bk{background:var(--card);border-radius:12px;margin-top:10px;overflow:hidden}
.bk>h3{margin:0;padding:12px;font-size:16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.bk>h3 small{font-weight:500;color:var(--sub);font-size:13px}
.ln{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
.ln .t{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.ln .t em{font-style:normal;color:var(--sub);font-size:13px;white-space:nowrap}
.ln.sub{padding-left:24px;background:#fafbf9}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main)}
.bar i.over{background:var(--bad)}
/* 계정 창: 업무·영성·건강 기록과 같은 모양 */
.bar-top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 0}
.bar-top strong{font-size:15px;color:var(--sub)}
#menuBtn{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:36px;padding:0 12px;font-size:14px;font-weight:500;white-space:nowrap}
.am-bg{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.am{max-height:100%;overflow-y:auto;width:100%;max-width:360px;background:var(--card);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.am-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.am-head strong{font-size:17px}
.am-x{color:var(--sub);font-size:18px;width:36px;min-height:36px}
.am-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;margin-top:8px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px}
.am-item small{color:var(--sub);font-size:12px}
.am-item .am-go{color:var(--sub);font-size:18px}
.am-item.danger{color:var(--bad)}
.am-back{color:var(--sub);font-size:14px;min-height:32px;padding:4px 2px}
.f{display:grid;gap:4px;font-size:13px;color:var(--sub);margin-bottom:10px;text-align:left}
.f input{font:inherit;color:var(--ink);padding:11px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-bottom:6px;text-align:left}
.main-btn{width:100%;padding:13px;border-radius:10px;font-weight:700;background:var(--main);color:#fff}
.main-btn:disabled{opacity:.5}
#auth{flex:1;overflow:auto;padding:48px 20px;text-align:center}
#auth h1{margin:0 0 4px;font-size:24px}
#auth p{margin:0 0 20px;color:var(--sub)}
#auth form{background:var(--card);border-radius:14px;padding:16px;max-width:360px;margin:0 auto}
[hidden]{display:none!important}
/* 알림·창 */
#toast{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));background:#1c2420;color:#fff;border-radius:12px;padding:12px 14px;display:none;gap:10px;align-items:center;flex-wrap:wrap;z-index:9}
#toast.on{display:flex}
#toast span{flex:1;min-width:140px}
#toast button{color:#8fe0bd;font-weight:700;padding:4px 6px}
#dlg{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:10}
#dlg.on{display:flex}
#dlg form{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:10px}
#dlg label{font-size:13px;color:var(--sub);display:grid;gap:4px}
#dlg input,#dlg select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:12px;border-radius:10px;font-weight:700;background:var(--line)}
.btns .ok{background:var(--main);color:#fff}
.btns .del{color:var(--bad)}
#msg{padding:40px 24px;text-align:center;color:var(--sub)}
/* 장부 고르기(가정|기업)와 기업 고정 경비 */
#books{margin-left:8px}
#books button{padding:6px 12px}
.fx{margin:0 12px 8px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fx>h4{margin:0;padding:9px 12px;font-size:14px;display:flex;justify-content:space-between;cursor:pointer}
.fx>h4 small{color:var(--sub);font-weight:500}
.fx .fr{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--line);font-size:14px}
.fx .fr span{flex:1}.fx .fr em{font-style:normal;color:var(--sub);font-size:12px}
.fx .fr button{background:var(--main);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
.fx .fr.ok{color:var(--sub)}.fx .fr.ok b{font-weight:500}
.pl .ln .t b{font-weight:700}.pl .ln .t .neg{color:var(--bad)}
</style>
</head>
<body>
<div id="msg">불러오는 중…</div>
<div id="auth" hidden></div>
<div class="bar-top" id="barTop" hidden><strong>재정 기록</strong><div class="seg" id="books" hidden></div><button id="menuBtn" style="margin-left:auto" aria-label="내 계정"><span id="myName"></span> ☰</button></div>
<div class="am-bg" id="amBg" role="dialog" aria-modal="true" aria-labelledby="amName" hidden>
  <div class="am">
    <div class="am-head"><strong id="amName"></strong><button type="button" class="am-x" id="amClose" aria-label="닫기">✕</button></div>
    <div id="amMain">
      <button type="button" class="am-item" id="amSet"><span>⚙️ 설정</span><span class="am-go">›</span></button>
      <button type="button" class="am-item danger" id="amOut"><span>로그아웃</span><small>이 앱의 모든 기기에서 나가져요</small></button>
    </div>
    <div id="amSetView" hidden>
      <button type="button" class="am-back" id="amBack">‹ 처음으로</button>
      <button type="button" class="am-item" id="amPw"><span>비밀번호 바꾸기</span><span class="am-go">›</span></button>
    </div>
    <form id="pwForm" hidden>
      <button type="button" class="am-back" id="pwBack">‹ 설정으로</button>
      <p id="pwMust" style="font-size:14px;color:var(--sub)" hidden>처음 비밀번호예요. 나만 아는 새 비밀번호로 바꿔 주세요. 바꾼 비밀번호는 다른 사람이 알 수 없어요.</p>
      <label class="f" style="margin-top:6px">지금 비밀번호<input id="pwNow" type="password" autocomplete="current-password" required></label>
      <label class="f">새 비밀번호 (6자 이상, 영어+숫자)<input id="pwNew" type="password" autocomplete="new-password" required minlength="6"></label>
      <label class="f">새 비밀번호 한 번 더<input id="pwNew2" type="password" autocomplete="new-password" required minlength="6"></label>
      <div class="err" id="pwErr"></div>
      <button class="main-btn" id="pwGo">바꾸기</button>
    </form>
  </div>
</div>
<main id="v-rec">
  <div class="top">
    <div class="seg"><button id="k-out" class="on">지출</button><button id="k-in" class="in">수입</button></div>
    <label class="date"><span id="dateLbl"></span><input type="date" id="date" aria-label="날짜"></label>
  </div>
  <div id="amt" class="amount zero">0원</div>
  <input id="memo" class="memo" placeholder="메모 (안 써도 됩니다)" autocomplete="off">
  <div id="fixed" class="fx" hidden></div>
  <div id="chips" class="chips"></div>
  <div class="keys" id="keys"></div>
</main>
<main id="v-list"><div class="month" data-m></div><div id="list" class="scroll"></div></main>
<main id="v-bud"><div class="month" data-m></div><div id="bud" class="scroll"></div></main>
<nav id="nav" hidden>
  <button data-v="rec" class="on">기록</button><button data-v="list">내역</button><button data-v="bud" id="nav3">예산안</button>
</nav>
<div id="toast"></div>
<div id="dlg"><form id="form"></form></div>
<script>
const API='https://trlnatdkebjvgiqneulv.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_BqE1VCDg50oi9zCflCjMuw_wYF55CTj';
const $=s=>document.querySelector(s);
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const TITHE=['근로소득','미지정공급','사업소득'];   // 기록 뒤 십일조 버튼을 띄우는 수입

// 로그인 = 업무·영성·건강 기록과 같은 공용 계정(2026-11-02 룡 결정)
const store={get(){try{return localStorage.getItem('fin_session')}catch(e){return null}},set(t){try{localStorage.setItem('fin_session',t)}catch(e){}},del(){try{localStorage.removeItem('fin_session');localStorage.removeItem('fin_token')}catch(e){}}};
let token=store.get(),me=null;

const st={kind:'지출',date:today(),amount:'',busy:false,month:today().slice(0,7)+'-01',data:null,open:{},book:null,fxOpen:true};
// 장부: 가정은 예전 그대로, 기업은 영역(청소·포멘토·그린주의·오레진)별 손익 + 공통 경비 (2026-11-03 룡 기준)
const isCo=()=>st.data&&st.data.book==='기업';

async function rpc(fn,args){
  const r=await fetch(API+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token,...args})});
  const t=await r.text();
  if(!r.ok){let m=t;try{m=JSON.parse(t).message}catch(e){}
    if(m==='auth'){logout();throw new Error('다시 로그인해 주세요.')}
    throw new Error(m)}
  return t?JSON.parse(t):null;
}
async function load(){st.data=await rpc('fin_load',{p_month:st.month,p_book:st.book});render()}
const items=()=>st.data.items;
const item=id=>items().find(i=>i.id===id);
const label=i=>i.detail||i.middle;
const isWeek=i=>i.middle==='식비';
const weekItem=date=>{const w=Math.ceil(Number(date.slice(8))/7);return items().find(i=>isWeek(i)&&i.detail===w+'주차')};

function toast(text,actions=[],ms=5000){
  const t=$('#toast');t.innerHTML=`<span>${esc(text)}</span>`;
  actions.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{t.classList.remove('on');f()};t.append(b)});
  t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),ms);
}

/* 기록 */
function renderAmount(){
  const a=$('#amt');a.textContent=won(st.amount||0);a.classList.toggle('zero',!st.amount);
}
function renderDate(){
  const d=new Date(st.date+'T00:00');
  $('#dateLbl').textContent=(st.date===today()?'오늘 ':'')+`${d.getMonth()+1}/${d.getDate()} (${'일월화수목금토'[d.getDay()]})`;
  $('#date').value=st.date;
}
function chip(i,name,fav){return `<button class="chip${fav?' fav':''}" data-id="${i.id}">${esc(name)}</button>`}
function renderChips(){
  const list=items().filter(i=>i.kind===st.kind);
  // 식비는 주차를 날짜로 정하므로 칩 하나로 보인다
  const wk=weekItem(st.date);
  const leaf=list.filter(i=>!isWeek(i)||i===wk);
  const name=i=>isWeek(i)?'식비':label(i);
  const count=i=>isWeek(i)?list.filter(isWeek).reduce((s,x)=>s+(st.data.usage[x.id]||0),0):(st.data.usage[i.id]||0);
  let h='';
  if(st.kind==='지출'){
    const fav=[...leaf].filter(i=>count(i)>0).sort((a,b)=>count(b)-count(a)).slice(0,9);
    if(fav.length)h+=`<h4>자주 쓰는 것</h4><div class="row">${fav.map(i=>chip(i,(i.area?i.area+' ':'')+name(i),1)).join('')}</div>`;
  }
  const groups=[];
  // 기업: 영역 이름 아래 매출·재료비·인건비, 그다음 공통 경비는 분류별
  leaf.forEach(i=>{const k=isCo()?(i.area||(st.kind==='수입'?'기타 수입':i.bucket)):(st.kind==='수입'?'수입':(i.detail&&!isWeek(i)?i.middle:i.bucket));let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,a:[]});g.a.push(i)});
  h+=groups.map(g=>`<h4>${esc(g.k)}</h4><div class="row">${g.a.map(i=>chip(i,name(i),st.kind==='수입')).join('')}</div>`).join('');
  $('#chips').innerHTML=h;
  $('#chips').parentElement.classList.toggle('in',st.kind==='수입');
  renderFixed();
}
/* 기업 고정 경비: 예산안 「월 고정지출」대로 미리 깔려 있고 「냈어요」 한 번이면 기록된다 */
function renderFixed(){
  const el=$('#fixed');const fx=isCo()&&st.kind==='지출'?st.data.fixed:[];
  el.hidden=!fx.length;if(!fx.length)return;
  const done=fx.filter(f=>f.paid).length;
  el.innerHTML=`<h4 data-t="1"><span>${st.fxOpen?'▾':'▸'} 이번 달 고정 경비</span><small>${done}/${fx.length} 냄 · ${won(fx.reduce((s,f)=>s+Number(f.amount),0))}</small></h4>`+
   (st.fxOpen?fx.map(f=>`<div class="fr${f.paid?' ok':''}"><span>${esc(f.name)} <em>${f.day?f.day+'일':''}</em></span><b>${Number(f.amount)?won(f.amount):'<em>금액 눌러서</em>'}</b>${f.paid?'<em>냈음</em>':`<button data-f="${f.id}">냈어요</button>`}</div>`).join(''):'');
}
$('#fixed').onclick=async e=>{
  if(e.target.closest('[data-t]')){st.fxOpen=!st.fxOpen;renderFixed();return}
  const id=e.target.dataset.f;if(!id||st.busy)return;
  const f=st.data.fixed.find(x=>x.id===id);
  // 금액이 정해지지 않은 고정 경비(국민연금처럼 0원)는 키패드에 누른 금액으로
  const amount=Number(f.amount)||Number(st.amount);
  if(!amount){const a=$('#amt');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');toast(f.name+' 금액을 먼저 눌러 주세요',[],1500);return}
  st.busy=true;
  try{
    // 보는 달이 이번 달이면 오늘, 지난달이면 그 달의 납부일로
    const date=st.month.slice(0,7)===today().slice(0,7)?today():st.month.slice(0,8)+pad(f.day||1);
    const eid=await rpc('fin_add',{p_date:date,p_item:f.item_id,p_amount:amount,p_memo:f.name,p_book:st.book,p_source:'fixed:'+f.id+':'+st.month.slice(0,7)});
    if(!Number(f.amount)){st.amount='';renderAmount()}
    toast(`${f.name} ${won(amount)} 기록`,[['취소',async()=>{await rpc('fin_delete',{p_id:eid,p_restore:false});await load();toast('취소했습니다',[],1500)}]],4000);
    await load();
  }catch(x){toast('저장 안 됨. 인터넷을 확인하고 다시 눌러 주세요. ('+x.message+')',[],8000)}
  st.busy=false;
};
async function save(i){
  if(st.busy)return;
  if(!st.amount){const a=$('#amt');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');toast('금액을 먼저 눌러 주세요',[],1500);return}
  st.busy=true;
  const amount=Number(st.amount),memo=$('#memo').value.trim(),date=st.date;
  try{
    const id=await rpc('fin_add',{p_date:date,p_item:i.id,p_amount:amount,p_memo:memo,p_book:st.book});
    st.amount='';$('#memo').value='';renderAmount();
    const name=isWeek(i)?'식비':(i.area?i.area+' ':'')+label(i);
    const acts=[['취소',async()=>{await rpc('fin_delete',{p_id:id,p_restore:false});await load();toast('취소했습니다',[],1500)}]];
    if(i.kind==='수입'&&TITHE.includes(i.middle)){
      const t=Math.ceil(amount/10),ti=items().find(x=>x.middle==='십일조(10%)');
      if(ti)acts.unshift([`십일조 ${t.toLocaleString('ko-KR')}원도 기록`,async()=>{await rpc('fin_add',{p_date:date,p_item:ti.id,p_amount:t,p_memo:''});await load();toast('십일조도 기록했습니다',[],1500)}]);
    }
    toast(`${name} ${won(amount)} 기록`,acts,acts.length>1?9000:4000);
    await load();
  }catch(e){toast('저장 안 됨. 인터넷을 확인하고 항목을 다시 눌러 주세요. ('+e.message+')',[],8000)}
  st.busy=false;
}
function press(k){
  if(k==='지움')st.amount=st.amount.slice(0,-1);
  else if(k==='C')st.amount='';
  else if((st.amount+k).length<=10&&(st.amount||(k!=='0'&&k!=='00'&&k!=='000')))st.amount+=k;
  renderAmount();
}
$('#keys').innerHTML=['1','2','3','C','4','5','6','지움','7','8','9','00','0','000'].map(k=>`<button type="button" class="${k==='C'||k==='지움'?'sm':''}" data-k="${k}"${k==='000'?' style="grid-column:span 3"':''}>${k}</button>`).join('');
$('#keys').onclick=e=>{const k=e.target.dataset.k;if(k)press(k)};
$('#chips').onclick=e=>{const id=e.target.dataset.id;if(id)save(item(id))};
function setKind(k){st.kind=k;$('#k-out').classList.toggle('on',k==='지출');$('#k-in').classList.toggle('on',k==='수입');renderChips()}
$('#k-out').onclick=()=>setKind('지출');$('#k-in').onclick=()=>setKind('수입');
$('#date').onchange=e=>{if(e.target.value){st.date=e.target.value;renderDate();renderChips()}};

/* 달 이동 */
function renderMonth(){
  const [y,m]=st.month.split('-').map(Number);
  document.querySelectorAll('[data-m]').forEach(el=>{el.innerHTML=`<button data-d="-1" aria-label="이전 달">‹</button><span>${y}년 ${m}월</span><button data-d="1" aria-label="다음 달">›</button>`;
    el.onclick=async e=>{const d=Number(e.target.dataset.d);if(!d)return;const n=new Date(y,m-1+d,1);st.month=ymd(n);await load()}});
}

/* 내역 */
function renderList(){
  const by={};st.data.entries.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
  const days=Object.keys(by);
  $('#list').innerHTML=days.length?days.map(d=>{
    const dt=new Date(d+'T00:00');
    return `<div class="day">${dt.getMonth()+1}/${dt.getDate()} (${'일월화수목금토'[dt.getDay()]})</div>`+by[d].map(e=>{
      const i=item(e.item_id)||{};const inc=i.kind==='수입';
      const nm=i.area?i.area+' '+i.middle:(i.detail?i.middle+' · '+i.detail:i.middle);
      const sub=isCo()?[e.memo,e.by].filter(Boolean).join(' · '):e.memo;   // 기업은 누가 적었는지도
      return `<button class="ent" data-e="${e.id}"><span>${esc(nm)}<small>${esc(sub)}</small></span><b class="${inc?'inc':''}">${inc?'+':''}${won(e.amount)}</b></button>`}).join('');
  }).join(''):'<p style="text-align:center;color:var(--sub);padding:32px">이 달 기록이 없습니다</p>';
}
$('#list').onclick=e=>{const b=e.target.closest('[data-e]');if(b)editEntry(st.data.entries.find(x=>x.id===b.dataset.e))};
function closeDlg(){$('#dlg').classList.remove('on')}
$('#dlg').onclick=e=>{if(e.target.id==='dlg')closeDlg()};
function editEntry(en){
  const groups={};items().forEach(i=>{const k=i.kind+' · '+(i.area||i.bucket);(groups[k]=groups[k]||[]).push(i)});
  $('#form').innerHTML=`<label>금액<input id="f-a" inputmode="numeric" value="${en.amount}"></label>
   <label>날짜<input id="f-d" type="date" value="${en.date}"></label>
   <label>항목<select id="f-i">${Object.entries(groups).map(([k,a])=>`<optgroup label="${esc(k)}">${a.map(i=>`<option value="${i.id}"${i.id===en.item_id?' selected':''}>${esc(i.detail?i.middle+' · '+i.detail:i.middle)}</option>`).join('')}</optgroup>`).join('')}</select></label>
   <label>메모<input id="f-m" value="${esc(en.memo)}"></label>
   <div class="btns"><button type="button" class="del" id="f-x">지우기</button><button type="button" id="f-c">닫기</button><button class="ok">저장</button></div>`;
  $('#f-c').onclick=closeDlg;
  $('#f-x').onclick=async()=>{closeDlg();await rpc('fin_delete',{p_id:en.id,p_restore:false});await load();
    toast('지웠습니다',[['되돌리기',async()=>{await rpc('fin_delete',{p_id:en.id,p_restore:true});await load()}]])};
  $('#form').onsubmit=async e=>{e.preventDefault();const a=Number($('#f-a').value.replace(/\D/g,''));if(!a){toast('금액을 확인해 주세요',[],1500);return}
    await rpc('fin_update',{p_id:en.id,p_date:$('#f-d').value,p_item:$('#f-i').value,p_amount:a,p_memo:$('#f-m').value});closeDlg();await load();toast('고쳤습니다',[],1500)};
  $('#dlg').classList.add('on');
}

/* 예산안 (시트와 같은 계산) */
function budgetOf(i,base){
  if(i.rate)return Math.round(base/0.87*Number(i.rate)/100)*100;
  return Number(st.data.budgets[i.id]||0);
}
/* 기업 손익: 영역마다 매출 − 재료비 − 인건비 = 이익, 공통 경비는 따로, 전체 = 영역 이익 합 − 공통 경비 */
function renderProfit(){
  const act={};st.data.entries.forEach(e=>act[e.item_id]=(act[e.item_id]||0)+Number(e.amount));
  const sum=f=>items().filter(f).reduce((s,i)=>s+(act[i.id]||0),0);
  const areas=[...new Set(items().filter(i=>i.area).map(i=>i.area))];
  const sales=sum(i=>i.kind==='수입'),cost=sum(i=>i.kind==='지출'&&i.area),common=sum(i=>i.kind==='지출'&&!i.area);
  const row=(name,v,sub='')=>`<div class="ln"><div class="t"><span>${esc(name)}</span><b class="${v<0?'neg':''}">${won(v)}</b></div>${sub?`<div class="t"><em>${sub}</em></div>`:''}</div>`;
  let h=`<div class="sum pl">
    <div class="tile"><small>총 매출</small><b>${won(sales)}</b></div>
    <div class="tile"><small>총 비용 (영역+공통)</small><b>${won(cost+common)}</b></div>
    <div class="tile wide"><small>기업 전체 이익</small><b class="${sales-cost-common<0?'neg':''}">${won(sales-cost-common)}</b></div></div>`;
  h+=`<div class="bk pl"><h3>영역별 이익<small>매출 − 재료비 − 인건비</small></h3>`;
  areas.forEach(a=>{const s=sum(i=>i.area===a&&i.kind==='수입'),c=sum(i=>i.area===a&&i.kind==='지출');
    h+=row(a,s-c,`매출 ${won(s)} · 비용 ${won(c)}`)});
  h+='</div>';
  h+=`<div class="bk pl"><h3>공통 경비<small>${won(common)}</small></h3>`;
  [...new Set(items().filter(i=>i.kind==='지출'&&!i.area).map(i=>i.bucket))].forEach(bk=>{const v=sum(i=>i.kind==='지출'&&!i.area&&i.bucket===bk);if(v)h+=row(bk,v)});
  const unpaid=(st.data.fixed||[]).filter(f=>!f.paid);
  if(unpaid.length)h+=row('아직 안 낸 고정 경비 '+unpaid.length+'건',unpaid.reduce((s,f)=>s+Number(f.amount),0));
  h+='</div>';
  $('#bud').innerHTML=h;
}
function renderBudget(){
  if(isCo()){renderProfit();return}
  const it=items().filter(i=>i.kind==='지출');
  const base=it.filter(i=>!i.rate).reduce((s,i)=>s+Number(st.data.budgets[i.id]||0),0);
  const act={};st.data.entries.forEach(e=>act[e.item_id]=(act[e.item_id]||0)+Number(e.amount));
  const inSum=m=>items().filter(i=>i.kind==='수입'&&(m?i.middle===m:i.middle!=='이월')).reduce((s,i)=>s+(act[i.id]||0),0);
  const income=inSum(),carry=inSum('이월');
  const plan=it.reduce((s,i)=>s+budgetOf(i,base),0),spent=it.reduce((s,i)=>s+(act[i.id]||0),0);
  const line=(name,b,a,attr='',cls='')=>{const p=b?Math.min(100,a/b*100):(a?100:0);
    return `<button class="ln ${cls}" ${attr}><div class="t"><span>${esc(name)}</span><em>${won(a)} / ${won(b)}</em></div><div class="bar"><i class="${a>b?'over':''}" style="width:${p}%"></i></div></button>`};
  let h=`<div class="sum">
    <div class="tile"><small>월 총수입</small><b>${won(income)}</b></div>
    <div class="tile"><small>실 지출</small><b>${won(spent)}</b></div>
    <div class="tile"><small>잔액 (이월 ${won(carry)} 포함)</small><b>${won(carry+income-spent)}</b></div>
    <div class="tile"><small>예상 지출</small><b>${won(plan)}</b></div>
    <div class="tile wide"><small>믿음으로 구할 금액</small><b>${won(plan-income-carry)}</b></div></div>`;
  [...new Set(it.map(i=>i.bucket))].forEach(bk=>{
    const a=it.filter(i=>i.bucket===bk);
    const sb=a.reduce((s,i)=>s+budgetOf(i,base),0),sa=a.reduce((s,i)=>s+(act[i.id]||0),0);
    h+=`<div class="bk"><h3>${esc(bk)}<small>${won(sa)} / ${won(sb)}</small></h3>`;
    [...new Set(a.map(i=>i.middle))].forEach(m=>{
      const sub=a.filter(i=>i.middle===m);
      if(sub.length===1&&!sub[0].detail){const i=sub[0];h+=line(m,budgetOf(i,base),act[i.id]||0,`data-b="${i.id}"`);return}
      const mb=sub.reduce((s,i)=>s+budgetOf(i,base),0),ma=sub.reduce((s,i)=>s+(act[i.id]||0),0);
      h+=line((st.open[m]?'▾ ':'▸ ')+m,mb,ma,`data-o="${esc(m)}"`);
      if(st.open[m])sub.forEach(i=>h+=line(i.detail,budgetOf(i,base),act[i.id]||0,`data-b="${i.id}"`,'sub'));
    });
    h+='</div>';
  });
  $('#bud').innerHTML=h;
}
$('#bud').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.o){st.open[b.dataset.o]=!st.open[b.dataset.o];renderBudget();return}
  if(b.dataset.b)editBudget(item(b.dataset.b));
};
function editBudget(i){
  if(i.rate){toast('십일조·봉헌물·이웃 나눔 예산은 다른 예산에서 자동 계산됩니다',[],3000);return}
  $('#form').innerHTML=`<label>${esc(i.detail||i.middle)} 예산 (${Number(st.month.slice(5,7))}월)<input id="f-b" inputmode="numeric" value="${st.data.budgets[i.id]||0}"></label>
   <div class="btns"><button type="button" id="f-c">닫기</button><button class="ok">저장</button></div>`;
  $('#f-c').onclick=closeDlg;
  $('#form').onsubmit=async e=>{e.preventDefault();await rpc('fin_set_budget',{p_month:st.month,p_item:i.id,p_amount:Number($('#f-b').value.replace(/\D/g,''))||0,p_book:st.book});closeDlg();await load()};
  $('#dlg').classList.add('on');
}

function render(){renderDate();renderAmount();renderChips();renderMonth();renderList();renderBudget();$('#nav3').textContent=isCo()?'손익':'예산안'}
/* 장부 고르기: 두 장부가 있을 때만 보인다. 마지막에 본 장부를 기억한다 */
function renderBooks(){
  const bs=me.books||[];const el=$('#books');el.hidden=bs.length<2;
  el.innerHTML=bs.map(b=>`<button data-b="${b.id}" class="${b.id===st.book?'on':''}">${esc(b.name)}</button>`).join('');
}
$('#books').onclick=async e=>{const b=e.target.dataset.b;if(!b||b===st.book)return;st.book=b;try{localStorage.setItem('fin_book',b)}catch(x){}renderBooks();st.amount='';await load();show('rec')};
function show(v){
  document.querySelectorAll('main').forEach(m=>m.classList.toggle('on',m.id==='v-'+v));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}
$('#nav').onclick=e=>{if(e.target.dataset.v)show(e.target.dataset.v)};
window.addEventListener('unhandledrejection',e=>toast('문제가 생겼습니다: '+(e.reason&&e.reason.message||e.reason),[],6000));

(async()=>{
  $('#msg').hidden=true;
  if(!token){renderAuth();return}
  try{await enter()}
  catch(e){if(token){$('#msg').hidden=false;$('#msg').textContent='열지 못했습니다: '+e.message}}
})();
async function enter(){
  me=await rpc('fin_me',{});
  const bs=me.books||[];let saved=null;try{saved=localStorage.getItem('fin_book')}catch(x){}
  st.book=(bs.find(b=>b.id===saved)||bs[0]||{}).id||null;
  renderBooks();await load();
  $('#auth').hidden=true;$('#barTop').hidden=false;$('#nav').hidden=false;$('#myName').textContent=me.name;show('rec');
  if(me.must_change_pw)forcePw();
}
function logout(){
  token=null;me=null;st.data=null;store.del();
  $('#barTop').hidden=true;$('#nav').hidden=true;$('#amBg').hidden=true;unforcePw();
  document.querySelectorAll('main').forEach(m=>m.classList.remove('on'));
  renderAuth();
}
function renderAuth(){
  const a=$('#auth');a.hidden=false;
  a.innerHTML=`<h1>재정 기록</h1><p>돈 쓰고 들어온 것을 바로</p>
   <form id="lf"><label class="f">아이디<input id="nick" autocomplete="username" required></label>
   <label class="f">비밀번호<input id="pw" type="password" autocomplete="current-password" required></label>
   <div class="err" id="err"></div><button class="main-btn" id="go">들어가기</button></form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const go=$('#go'),err=$('#err');go.disabled=true;err.textContent='';
    try{
      const r=await fetch(API+'fin_login',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_id:$('#nick').value,p_pw:$('#pw').value})});
      const d=await r.json();
      if(!r.ok||d.error){err.textContent=d.error||'들어가지 못했어요. 다시 해 주세요.';go.disabled=false;return}
      token=d.token;store.set(token);await enter();
    }catch(x){err.textContent='인터넷 연결을 확인해 주세요.';go.disabled=false}};
}
/* ☰ 계정 창. 로그아웃은 이 앱의 모든 기기에서 나간다. 비밀번호를 바꾸면 계정이 같아 모든 기록에서 나간다 */
/* 처음 비밀번호면 바꾸기 전에는 닫히지 않는다(업무·영성·건강 기록과 같음) */
let pwForced=false;
function amView(v){$('#amMain').hidden=v!=='main';$('#amSetView').hidden=v!=='set';$('#pwForm').hidden=v!=='pw'}
function forcePw(){
  if(pwForced)return;pwForced=true;amView('pw');$('#pwForm').reset();$('#pwErr').textContent='';
  $('#amName').textContent=me.name+'님';$('#amClose').hidden=$('#pwBack').hidden=true;$('#pwMust').hidden=false;$('#amBg').hidden=false;
}
function unforcePw(){pwForced=false;$('#amClose').hidden=$('#pwBack').hidden=false;$('#pwMust').hidden=true}
$('#menuBtn').onclick=()=>{amView('main');$('#amName').textContent=me.name+'님';$('#amBg').hidden=false};
$('#amClose').onclick=()=>{$('#amBg').hidden=true};
$('#amBg').onclick=e=>{if(e.target.id==='amBg'&&!pwForced)$('#amBg').hidden=true};
$('#amSet').onclick=()=>amView('set');
$('#amBack').onclick=()=>amView('main');
$('#pwBack').onclick=()=>amView('set');
$('#amPw').onclick=()=>{$('#pwForm').reset();$('#pwErr').textContent='';amView('pw')};
$('#amOut').onclick=async()=>{await rpc('fin_logout_all',{}).catch(()=>{});logout()};
$('#pwForm').onsubmit=async e=>{
  e.preventDefault();$('#pwErr').textContent='';
  if($('#pwNew').value!==$('#pwNew2').value){$('#pwErr').textContent='새 비밀번호 두 칸이 서로 달라요.';return}
  const btn=$('#pwGo');btn.disabled=true;
  try{
    const d=await rpc('fin_change_password',{p_current:$('#pwNow').value,p_next:$('#pwNew').value});
    if(d.error){$('#pwErr').textContent=d.error;return}
    logout();$('#err').textContent='비밀번호를 바꿨어요. 모든 기기에서 나갔어요. 새 비밀번호로 들어와 주세요.';
  }catch(x){$('#pwErr').textContent=x.message}finally{btn.disabled=false}
};
// 앱을 다시 열 때 최신으로
window.refresh=()=>{if(st.data&&!st.busy)load().catch(()=>{})};
</script>
