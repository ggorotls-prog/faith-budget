<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f6f54">
<title>재정 기록</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1c2420;--sub:#6b756f;--line:#e2e5df;--main:#1f6f54;--soft:#e4f1eb;--in:#1b62b5;--insoft:#e3eefa;--bad:#c23b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
main{flex:1;min-height:0;display:none;flex-direction:column}
main.on{display:flex}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 0;color:var(--sub);font-weight:600}
nav button.on{color:var(--main)}
/* 기록 */
.top{display:flex;gap:8px;padding:10px 12px 0;align-items:center}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px}
.seg button{padding:7px 16px;border-radius:8px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--main)}
.seg button.on.in{color:var(--in)}
.date{margin-left:auto;background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600;position:relative}
.date input{position:absolute;inset:0;opacity:0;width:100%}
.amount{padding:6px 16px 2px;text-align:right;font-size:38px;font-weight:800;letter-spacing:-.5px;min-height:58px}
.amount.zero{color:#b5bbb6}
.amount.shake{animation:s .3s}
@keyframes s{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.memo{margin:0 12px 8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;width:calc(100% - 24px)}
.chips{flex:1;min-height:0;overflow:auto;padding:0 12px 8px}
.chips h4{margin:10px 0 6px;font-size:13px;color:var(--sub);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px}
.chip:active{background:var(--soft)}
.chip.fav{background:var(--soft);border-color:#bfe0d1}
.in .chip.fav{background:var(--insoft);border-color:#bcd5f2}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.keys button{background:var(--card);padding:13px 0;font-size:21px;font-weight:600}
.keys button:active{background:var(--soft)}
.keys .sm{font-size:16px;color:var(--sub)}
/* 내역·예산 */
.scroll{flex:1;min-height:0;overflow:auto;padding:0 12px 16px}
.month{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px;font-weight:700;font-size:17px}
.month button{padding:4px 14px;font-size:20px;color:var(--main)}
.day{margin:12px 0 4px;font-size:13px;color:var(--sub);font-weight:600}
.ent{display:flex;width:100%;text-align:left;background:var(--card);padding:11px 12px;border-bottom:1px solid var(--line);gap:10px;align-items:center}
.ent b{flex:none;font-weight:700}
.ent span{flex:1;min-width:0}
.ent small{display:block;color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .inc{color:var(--in)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border-radius:12px;padding:12px}
.tile small{color:var(--sub);font-size:13px;display:block}
.tile b{font-size:18px}
.tile.wide{grid-column:1/-1}
.bk{background:var(--card);border-radius:12px;margin-top:10px;overflow:hidden}
.bk>h3{margin:0;padding:12px;font-size:16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.bk>h3 small{font-weight:500;color:var(--sub);font-size:13px}
.ln{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
.ln .t{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.ln .t em{font-style:normal;color:var(--sub);font-size:13px;white-space:nowrap}
.ln.sub{padding-left:24px;background:#fafbf9}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main)}
.bar i.over{background:var(--bad)}
/* 계정 창: 업무·영성·건강 기록과 같은 모양 */
.bar-top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 0}
.bar-top strong{font-size:15px;color:var(--sub)}
#menuBtn{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:36px;padding:0 12px;font-size:14px;font-weight:500;white-space:nowrap}
.am-bg{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.am{max-height:100%;overflow-y:auto;width:100%;max-width:360px;background:var(--card);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.am-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.am-head strong{font-size:17px}
.am-x{color:var(--sub);font-size:18px;width:36px;min-height:36px}
.am-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;margin-top:8px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px}
.am-item small{color:var(--sub);font-size:12px}
.am-item .am-go{color:var(--sub);font-size:18px}
.am-item.danger{color:var(--bad)}
.am-back{color:var(--sub);font-size:14px;min-height:32px;padding:4px 2px}
.f{display:grid;gap:4px;font-size:13px;color:var(--sub);margin-bottom:10px;text-align:left}
.f input{font:inherit;color:var(--ink);padding:11px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-bottom:6px;text-align:left}
.main-btn{width:100%;padding:13px;border-radius:10px;font-weight:700;background:var(--main);color:#fff}
.main-btn:disabled{opacity:.5}
#auth{flex:1;overflow:auto;padding:48px 20px;text-align:center}
#auth h1{margin:0 0 4px;font-size:24px}
#auth p{margin:0 0 20px;color:var(--sub)}
#auth form{background:var(--card);border-radius:14px;padding:16px;max-width:360px;margin:0 auto}
[hidden]{display:none!important}
/* 알림·창 */
#toast{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));background:#1c2420;color:#fff;border-radius:12px;padding:12px 14px;display:none;gap:10px;align-items:center;flex-wrap:wrap;z-index:9}
#toast.on{display:flex}
#toast span{flex:1;min-width:140px}
#toast button{color:#8fe0bd;font-weight:700;padding:4px 6px}
#dlg{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:10}
#dlg.on{display:flex}
#dlg form{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:10px}
#dlg label{font-size:13px;color:var(--sub);display:grid;gap:4px}
#dlg input,#dlg select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:12px;border-radius:10px;font-weight:700;background:var(--line)}
.btns .ok{background:var(--main);color:#fff}
.btns .del{color:var(--bad)}
#msg{padding:40px 24px;text-align:center;color:var(--sub)}
/* 장부 고르기(가정|기업)와 기업 고정 경비 */
#books{margin-left:8px}
#books button{padding:6px 12px}
.fx{margin:0 12px 8px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fx>h4{margin:0;padding:9px 12px;font-size:14px;display:flex;justify-content:space-between;cursor:pointer}
.fx>h4 small{color:var(--sub);font-weight:500}
.fx .fr{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--line);font-size:14px}
.fx .fr span{flex:1}.fx .fr em{font-style:normal;color:var(--sub);font-size:12px}
.fx .fr button{background:var(--main);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
.fx .fr.ok{color:var(--sub)}.fx .fr.ok b{font-weight:500}
.pl .ln .t b{font-weight:700}.pl .ln .t .neg{color:var(--bad)}
.chip.more{background:var(--bg);color:var(--sub);border-style:dashed}
/* 빠른 기록 창(?quick=1): 위젯·One hand에서 여는 작은 창. 기록 화면만, 저장하면 닫힌다 */
.quick #barTop,.quick #nav{display:none!important}
.quick html,.quick body,html.quick,html.quick body{background:transparent}
.quick #v-rec{border-radius:18px;background:var(--bg);overflow:hidden}
.quick #auth{background:var(--bg);border-radius:18px}
.quick #books{margin-left:0;margin-right:8px}
.quick .date{margin-left:auto}
/* 빠른 창 버튼식 */
.fh{display:flex;align-items:center;gap:8px;padding:6px 12px 0}
#back{font-size:26px;line-height:1;padding:2px 10px;color:var(--main);font-weight:700}
#crumb{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#flow h4{margin:14px 0 6px;font-size:17px}
#flow h5{margin:12px 0 4px;font-size:14px;color:var(--ink);font-weight:700}
#flow h5.sub{font-size:12px;color:var(--sub);font-weight:600;margin-top:6px}
.bb{display:grid;gap:8px}
.bb.two{grid-template-columns:1fr 1fr}
.bb button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;font-size:17px;font-weight:700;text-align:center;min-height:58px}
.bb button:active{background:var(--soft)}
.bb button.wide{grid-column:1/-1}
.bb button.off{color:#b5bbb6;background:var(--bg)}.bb button.off small{display:block;font-size:12px;font-weight:500}
.bb button.fav{background:var(--soft);border-color:#bfe0d1}
.bb button.more{background:var(--bg);color:var(--sub);border-style:dashed;font-weight:600}
#pay{display:flex;flex-direction:column;flex:1;min-height:0}
#pay .keys{margin-top:auto}
#memoBox{padding:8px 0 0}
#memoBox .memo{width:calc(100% - 24px)}
#flow .none{color:var(--sub);text-align:center;padding:40px 20px}
.quick .fh{padding-top:4px}
#saveBtn.save{border-radius:0;padding:15px;font-size:17px}
/* 폰: 기록 위 알림 한 줄(예산 넘은 것·안 낸 고정) (2026-11-06 룡: 폰은 수집 + 급하고 중요한 것만) */
#alert{margin:8px 12px 0;padding:10px 12px;border-radius:12px;background:#fdecec;color:var(--bad);font-size:14px;font-weight:600;text-align:left;line-height:1.45}
#alert small{display:block;color:#8a4a4a;font-weight:500}
/* PC: 대시보드 (2026-11-06 룡: PC는 수집보다 전체·쌓인 기록·통계) */
#nav [data-v=dash]{display:none}
.pc #nav [data-v=dash]{display:block}
.pc #barTop{order:-2;padding:10px 24px 0}
.pc #nav{order:-1;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:8px;padding:0 24px}
.pc #nav button{flex:none;padding:12px 22px}
.pc #nav button.on{box-shadow:inset 0 -3px 0 var(--main)}
.pc main#v-rec,.pc main#v-list,.pc main#v-bud{width:100%;max-width:560px;margin:0 auto}
.pc #toast{left:50%;right:auto;transform:translateX(-50%);width:min(560px,90vw);bottom:24px}
.pc #dlg{align-items:center;justify-content:center}.pc #dlg form{max-width:480px;border-radius:16px}
#dash{padding:0 24px 32px}
.dg{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;max-width:1240px;margin:0 auto}
.dc{background:var(--card);border-radius:14px;padding:16px;grid-column:span 6;min-width:0}
.dc.full{grid-column:1/-1}.dc.s4{grid-column:span 4}.dc.s8{grid-column:span 8}.dc.s3{grid-column:span 3}
.dc h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.dc h3 small{color:var(--sub);font-weight:500;font-size:13px}
.kpi small{color:var(--sub);font-size:13px;display:block}
.kpi b{font-size:24px;display:block;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:13px;color:var(--sub)}
.up{color:var(--bad)!important}.dn{color:var(--main)!important}
.neg{color:var(--bad)}
.lg{display:flex;gap:14px;font-size:13px;color:var(--sub);margin-bottom:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:var(--sub)}
table.pv{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.pv th,.pv td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.pv th:first-child,.pv td:first-child{text-align:left;white-space:normal}
.pv thead th{color:var(--sub);font-weight:600}
.pv tr.gh td{background:var(--bg);font-weight:700}
.pv td.avg{color:var(--sub)}
.ovl .ln .t b{color:var(--bad)}
@media(max-width:1100px){.dc,.dc.s4,.dc.s8{grid-column:1/-1}.dc.s3{grid-column:span 6}}
</style>
</head>
<body>
<div id="msg">불러오는 중…</div>
<div id="auth" hidden></div>
<div class="bar-top" id="barTop" hidden><strong>재정 기록</strong><div class="seg" id="books" hidden></div><button id="menuBtn" style="margin-left:auto" aria-label="내 계정"><span id="myName"></span> ☰</button></div>
<div class="am-bg" id="amBg" role="dialog" aria-modal="true" aria-labelledby="amName" hidden>
  <div class="am">
    <div class="am-head"><strong id="amName"></strong><button type="button" class="am-x" id="amClose" aria-label="닫기">✕</button></div>
    <div id="amMain">
      <button type="button" class="am-item" id="amSet"><span>⚙️ 설정</span><span class="am-go">›</span></button>
      <button type="button" class="am-item danger" id="amOut"><span>로그아웃</span><small>이 앱의 모든 기기에서 나가져요</small></button>
    </div>
    <div id="amSetView" hidden>
      <button type="button" class="am-back" id="amBack">‹ 처음으로</button>
      <button type="button" class="am-item" id="amPw"><span>비밀번호 바꾸기</span><span class="am-go">›</span></button>
    </div>
    <form id="pwForm" hidden>
      <button type="button" class="am-back" id="pwBack">‹ 설정으로</button>
      <p id="pwMust" style="font-size:14px;color:var(--sub)" hidden>처음 비밀번호예요. 나만 아는 새 비밀번호로 바꿔 주세요. 바꾼 비밀번호는 다른 사람이 알 수 없어요.</p>
      <label class="f" style="margin-top:6px">지금 비밀번호<input id="pwNow" type="password" autocomplete="current-password" required></label>
      <label class="f">새 비밀번호 (6자 이상, 영어+숫자)<input id="pwNew" type="password" autocomplete="new-password" required minlength="6"></label>
      <label class="f">새 비밀번호 한 번 더<input id="pwNew2" type="password" autocomplete="new-password" required minlength="6"></label>
      <div class="err" id="pwErr"></div>
      <button class="main-btn" id="pwGo">바꾸기</button>
    </form>
  </div>
</div>
<main id="v-dash"><div class="month" data-m></div><div id="dash" class="scroll"></div></main>
<main id="v-rec">
  <div class="top">
    <div class="seg" id="kindSeg"><button id="k-in" class="in">수입</button><button id="k-out" class="on">지출</button></div>
    <label class="date"><span id="dateLbl"></span><input type="date" id="date" aria-label="날짜"></label>
  </div>
  <button id="alert" hidden></button>
  <div class="fh"><button id="back" aria-label="뒤로" hidden>‹</button><div id="crumb"></div></div>
  <div id="flow" class="scroll"></div>
  <div id="pay" hidden>
    <div id="amt" class="amount zero">0원</div>
    <div class="keys" id="keys"></div>
    <button id="nextBtn" class="main-btn save">다음</button>
  </div>
  <div id="memoBox" hidden>
    <input id="memo" class="memo" placeholder="메모 (안 써도 됩니다)" autocomplete="off">
    <button id="saveBtn" class="main-btn save">저장</button>
  </div>
</main>
<main id="v-list"><div class="month" data-m></div><div id="list" class="scroll"></div></main>
<main id="v-bud"><div class="month" data-m></div><div id="bud" class="scroll"></div></main>
<nav id="nav" hidden>
  <button data-v="dash">대시보드</button><button data-v="rec" class="on">기록</button><button data-v="list">내역</button><button data-v="bud" id="nav3">예산안</button>
</nav>
<div id="toast"></div>
<div id="dlg"><form id="form"></form></div>
<script>
const API='https://trlnatdkebjvgiqneulv.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_BqE1VCDg50oi9zCflCjMuw_wYF55CTj';
const $=s=>document.querySelector(s);
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const TITHE=['근로소득','미지정공급','사업소득'];   // 기록 뒤 십일조 버튼을 띄우는 수입

// 로그인 = 업무·영성·건강 기록과 같은 공용 계정(2026-11-02 룡 결정)
const store={get(){try{return localStorage.getItem('fin_session')}catch(e){return null}},set(t){try{localStorage.setItem('fin_session',t)}catch(e){}},del(){try{localStorage.removeItem('fin_session');localStorage.removeItem('fin_token')}catch(e){}}};
let token=store.get(),me=null;

const st={kind:'지출',date:today(),amount:'',busy:false,month:today().slice(0,7)+'-01',data:null,open:{},book:null,fxOpen:null,more:false};
// 빠른 기록 창(위젯·One hand): ?quick=1&kind=수입. 저장하면 앱 창이 닫힌다 (2026-11-03 룡: 위젯 필수, One hand는 만들어 두기)
const Q=new URLSearchParams(location.search);const QUICK=Q.get('quick')==='1';
if(QUICK){document.body.classList.add('quick');document.documentElement.classList.add('quick');if(Q.get('kind')==='수입')st.kind='수입'}
const closeQuick=()=>{try{if(window.Android&&Android.close)Android.close();else window.close()}catch(e){}};
// 가정 장부에서 매일 쓰는 항목(칩에 바로 보임). 나머지는 「그 밖에…」와 「이번 달 고정 지출」로 (2026-11-03 Claude 제안, 룡 확인 전)
const DAILY_MID=['식비','아침식비','교통비','생필품','기타지출','교육비'],DAILY_FAM=['의료비','의류/미용비','아이들유지비','간식비'];
const isDaily=i=>DAILY_MID.includes(i.middle)||(i.middle==='가족관리비'&&DAILY_FAM.includes(i.detail));
// 장부: 가정은 예전 그대로, 기업은 영역(청소·포멘토·그린주의·오레진)별 손익 + 공통 경비 (2026-11-03 룡 기준)
const isCo=()=>st.data&&st.data.book==='기업';
// PC = 넓은 화면의 브라우저(앱·빠른 창은 늘 폰) → 대시보드부터
const PC=!QUICK&&!window.Android&&matchMedia('(min-width:900px)').matches;
if(PC)document.body.classList.add('pc');
// 오레진 수당: 3.3%를 떼고 통장에 들어온다. 받은 돈만 누르면 세전·뗀 세금을 계산 (2026-11-05 귀룡 확인, 판매-기준.md)
const isLC=i=>!!i&&i.area==='오레진'&&i.middle==='수당';
const lcTax=net=>{const g=Math.round(net/0.967);return{gross:g,tax:g-net}};

async function rpc(fn,args){
  const r=await fetch(API+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token,...args})});
  const t=await r.text();
  if(!r.ok){let m=t;try{m=JSON.parse(t).message}catch(e){}
    if(m==='auth'){logout();throw new Error('다시 로그인해 주세요.')}
    throw new Error(m)}
  return t?JSON.parse(t):null;
}
async function load(){await loadAll();render()}
const items=()=>st.data.items;
const item=id=>items().find(i=>i.id===id);
const label=i=>i.detail||i.middle;
const isWeek=i=>i.middle==='식비'&&/주차$/.test(i.detail||'');   // 가정 식비만 주차(기업 식비는 보통 항목)
const weekItem=date=>{const w=Math.ceil(Number(date.slice(8))/7);return items().find(i=>isWeek(i)&&i.detail===w+'주차')};

function toast(text,actions=[],ms=5000){
  const t=$('#toast');t.innerHTML=`<span>${esc(text)}</span>`;
  actions.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{t.classList.remove('on');f()};t.append(b)});
  t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),ms);
}

/* 기록: 앱·위젯 똑같이 한 길, 한 화면에 하나씩 (2026-11-04 룡: 앱시트처럼 단순하게)
   지출|수입 → 금액 → 영역(결제권 있는 것만: 가정·청소·포멘토·그린주의·오레진·기업 공통) → 항목 → 메모 → 저장 */
const F={bk:null,area:null,path:[],item:null,qd:{}};
// 두 장부의 항목을 다 들고 있는다(영역이 장부를 가른다). 내역·손익은 위 가정|기업 토글의 장부(st.data)
async function loadAll(){
  for(const b of (me.books||[]))F.qd[b.id]=await rpc('fin_load',{p_month:st.month,p_book:b.id});
  st.data=F.qd[st.book]||Object.values(F.qd)[0];
}
const bookName=id=>((me.books||[]).find(b=>b.id===id)||{}).name||'';
// 내 영역: scopes(book, area) → 이름. 가정 장부는 「가정」, 기업 area ''는 「기업 공통」
const scopes=()=>(me.scopes||[]).map(s=>({book:s.book,area:s.area,name:bookName(s.book)==='가정'?'가정':(s.area||'기업 공통')}));
const scopeOf=name=>scopes().find(s=>s.name===name);
const itemsOf=sc=>((F.qd[sc.book]||{}).items||[]).filter(i=>i.kind===st.kind&&(i.area||'')===sc.area);
const itemName=i=>isWeek(i)?'식비':(i.detail?i.middle+' · '+i.detail:i.middle);
const bigBtn=(attr,text,cls='')=>`<button class="${cls}" ${attr}>${esc(text)}</button>`;
/* 입력 순서 (2026-11-06 룡): 수입|지출 → 금액 → 가정|기업
   → 가정: 대분류 → 중분류 → 소분류 / 기업: 내 영역(결제권 있는 것만) → 대분류 → 항목 → 메모 → 저장
   고를 것이 하나뿐인 칸은 저절로 넘어간다(식비 주차는 날짜로) */
const LV=['bucket','middle','detail'];
const myBooks=()=>[...new Set(scopes().map(s=>bookName(s.book)))].filter(b=>scopes().some(s=>bookName(s.book)===b&&itemsOf(s).length));
const coScopes=()=>scopes().filter(s=>bookName(s.book)==='기업'&&itemsOf(s).length);
function startFlow(){F.bk=null;F.bkAuto=false;F.area=null;F.areaAuto=false;F.path=[];F.item=null;st.amount='';$('#memo').value='';renderFlow()}
// 지금 자리에서 고를 것: {lv, opts} 또는 항목이 정해지면 F.item을 채운다
function resolve(){
  if(!F.bk)return;   // 가정|기업은 늘 묻는다(2026-11-06 룡)
  if(!F.area){
    if(F.bk==='가정')F.area='가정';
    else{const cs=coScopes();if(cs.length===1){F.area=cs[0].name;F.areaAuto=true}else return}
  }
  const sc=scopeOf(F.area);if(!sc)return;
  for(;;){
    let c=itemsOf(sc).filter(i=>F.path.every((p,k)=>(i[LV[k]]||'')===p.v));
    if(F.path[1]&&F.path[1].v==='식비'&&c.some(isWeek)){const w=Math.ceil(Number(st.date.slice(8))/7)+'주차';c=c.filter(i=>!isWeek(i)||i.detail===w)}
    if(c.length===1){F.item=c[0];return}
    if(!c.length||F.path.length>=LV.length){F.path=[];return}
    const lv=LV[F.path.length],opts=[...new Set(c.map(i=>i[lv]||''))];
    if(opts.length===1){F.path.push({v:opts[0],auto:true});continue}
    return{lv,opts,c};
  }
}
const stepOf=()=>{if(!st.amount)return 'amount';if(F.item)return 'memo';const r=resolve();if(F.item)return 'memo';if(!F.bk)return 'book';if(!F.area)return 'area';return r?'pick':'none'};
function renderAmount(){const a=$('#amt');a.textContent=won(st.amount||0);a.classList.toggle('zero',!st.amount)}
function renderDate(){
  const d=new Date(st.date+'T00:00');
  $('#dateLbl').textContent=(st.date===today()?'오늘 ':'')+`${d.getMonth()+1}/${d.getDate()} (${'일월화수목금토'[d.getDay()]})`;
  $('#date').value=st.date;
}
function setKind(k){st.kind=k;$('#k-out').classList.toggle('on',k==='지출');$('#k-in').classList.toggle('on',k==='수입');startFlow()}
function renderFlow(){
  if(!st.data)return;
  const my=scopes();
  const step=my.length?stepOf():'none';
  $('#pay').hidden=step!=='amount';$('#flow').hidden=step==='amount';
  $('#memoBox').hidden=step!=='memo';
  $('#back').hidden=step==='amount'||step==='none';
  $('#v-rec').classList.toggle('in',st.kind==='수입');
  const crumb=[st.amount&&won(st.amount),F.bk==='기업'?F.area:F.bk,...F.path.filter(p=>p.v&&!(F.item&&isWeek(F.item)&&p.v===F.item.detail)).map(p=>p.v)].filter(Boolean);
  if(F.item){const n=isLC(F.item)?'수당 (통장에 들어온 돈)':isWeek(F.item)?'식비':(F.item.detail||F.item.middle);if(crumb[crumb.length-1]!==n&&!(isWeek(F.item)&&crumb[crumb.length-1]==='식비'))crumb.push(n)}
  $('#crumb').textContent=crumb.join(' › ');
  let h='';
  if(step==='none')h=`<p class="none">기록은 결제권이 있는 사람만 해요. 내역·손익은 볼 수 있어요.</p>`;
  else if(step==='book'){const ok=myBooks();h=`<h4>어디 돈?</h4><div class="bb two">${['가정','기업'].map(b=>ok.includes(b)?bigBtn(`data-bk="${esc(b)}"`,b):`<button class="off" data-no="${b}">${b}<small>결제권 없음</small></button>`).join('')}</div>`}
  else if(step==='area')h=`<h4>기업 어느 영역?</h4><div class="bb two">${coScopes().map(s=>bigBtn(`data-area="${esc(s.name)}"`,s.name)).join('')}</div>`;
  else if(step==='pick'){const r=resolve();
    const title={bucket:'대분류',middle:'중분류',detail:'소분류'}[r.lv];
    h=`<h4>${title}</h4><div class="bb two">${r.opts.map(o=>{const one=r.c.filter(i=>(i[r.lv]||'')===o);
      const t=o||'그 밖에';const lbl=one.length===1&&isLC(one[0])?'수당 (통장에 들어온 돈)':one.length===1&&isWeek(one[0])?'식비':t;
      return bigBtn(`data-v="${esc(o)}"`,lbl)}).join('')}</div>`}
  $('#flow').innerHTML=h;
  if(step==='amount')renderAmount();
  if(step==='memo')setTimeout(()=>$('#memo').focus(),50);
  renderAlert();
}
$('#flow').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.no){toast(d.no+' 장부는 결제권이 있는 사람만 기록해요',[],2500);return}
  if(d.bk!==undefined){F.bk=d.bk;F.bkAuto=false;renderFlow();return}
  if(d.area!==undefined){F.area=d.area;F.areaAuto=false;renderFlow();return}
  if(d.v!==undefined){F.path.push({v:d.v,auto:false});renderFlow();return}
};
// 뒤로: 저절로 넘어간 칸은 건너뛰고, 내가 고른 칸 하나를 되돌린다
$('#back').onclick=()=>{
  F.item=null;
  while(F.path.length&&F.path[F.path.length-1].auto)F.path.pop();
  if(F.path.length)F.path.pop();
  else if(F.bk==='기업'&&F.area&&!F.areaAuto){F.area=null}
  else if(F.bk&&!F.bkAuto){F.bk=null;F.area=null}
  else{F.bk=null;F.area=null;st.amount=''}
  // 고른 칸이 하나도 안 남았는데 다시 저절로 같은 자리로 오면 한 칸 더 뒤로
  renderFlow();
};
function press(k){
  if(k==='지움')st.amount=st.amount.slice(0,-1);
  else if(k==='C')st.amount='';
  else if((st.amount+k).length<=10&&(st.amount||(k!=='0'&&k!=='00'&&k!=='000')))st.amount+=k;
  renderAmount();
}
$('#keys').innerHTML=['1','2','3','C','4','5','6','지움','7','8','9','00','0','000'].map(k=>`<button type="button" class="${k==='C'||k==='지움'?'sm':''}" data-k="${k}"${k==='000'?' style="grid-column:span 3"':''}>${k}</button>`).join('');
$('#keys').onclick=e=>{const k=e.target.dataset.k;if(k)press(k)};
$('#nextBtn').onclick=()=>{if(!st.amount){const a=$('#amt');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');toast('금액을 눌러 주세요',[],1500);return}renderFlow()};
$('#k-out').onclick=()=>setKind('지출');$('#k-in').onclick=()=>setKind('수입');
$('#date').onchange=e=>{if(e.target.value){st.date=e.target.value;renderDate();if(F.item&&isWeek(F.item))F.item=null,F.path=F.path.slice(0,2);renderFlow()}};
$('#saveBtn').onclick=save;
$('#memo').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();save()}};
async function save(){
  const i=F.item,sc=scopeOf(F.area);if(!i||!sc||st.busy)return;
  st.busy=true;
  const amount=Number(st.amount),memo=$('#memo').value.trim(),date=st.date,book=sc.book;
  try{
    const id=await rpc('fin_add',{p_date:date,p_item:i.id,p_amount:amount,p_memo:memo,p_book:book});
    const acts=[['취소',async()=>{await rpc('fin_delete',{p_id:id,p_restore:false});await loadAll();render();toast('취소했습니다',[],1500)}]];
    if(i.kind==='수입'&&TITHE.includes(i.middle)){
      const t=Math.ceil(amount/10),ti=(F.qd[book].items||[]).find(x=>x.middle==='십일조(10%)');
      if(ti)acts.unshift([`십일조 ${t.toLocaleString('ko-KR')}원도 기록`,async()=>{await rpc('fin_add',{p_date:date,p_item:ti.id,p_amount:t,p_memo:'',p_book:book});await loadAll();render();toast('십일조도 기록했습니다',[],1500)}]);
    }
    const lc=isLC(i)?lcTax(amount):null;
    toast(`${F.area} ${itemName(i)} ${won(amount)} 기록`+(lc?` · 세전 ${won(lc.gross)}, 뗀 세금 3.3% ${won(lc.tax)}`:''),acts,acts.length>1||lc?9000:4000);
    startFlow();
    await loadAll();render();
    if(QUICK)setTimeout(closeQuick,acts.length>1?6000:1000);   // 빠른 창은 저장하면 닫힌다
  }catch(e){toast('저장 안 됨. ('+e.message+')',[],8000)}
  st.busy=false;
}

/* 고정 경비(기업)·고정 지출(가정): 손익·예산안 탭 맨 위. 미리 깔려 있고 「냈어요」 한 번이면 기록된다 */
function homeFixed(){
  const it=items().filter(i=>i.kind==='지출');
  const base=it.filter(i=>!i.rate).reduce((s,i)=>s+Number(st.data.budgets[i.id]||0),0);
  const ym=st.month.slice(0,7);
  return it.filter(i=>!isDaily(i)&&!isWeek(i)).map(i=>({id:i.id,item_id:i.id,name:i.detail?i.middle+' · '+i.detail:i.middle,day:null,amount:budgetOf(i,base),
    paid:(st.data.entries.find(e=>e.fixed==='fixed:'+i.id+':'+ym)||{}).id})).filter(f=>f.amount>0);
}
const fixedList=()=>isCo()?(st.data.fixed||[]):homeFixed();
function fixedHtml(){
  const fx=fixedList();if(!fx.length)return '';
  if(st.fxOpen===null)st.fxOpen=isCo();   // 기업은 경비부터(기준 ⑤), 가정은 접어 둠
  const done=fx.filter(f=>f.paid).length;
  return `<div class="fx"><h4 data-t="1"><span>${st.fxOpen?'▾':'▸'} 이번 달 고정 ${isCo()?'경비':'지출'}</span><small>${done}/${fx.length} 냄 · ${won(fx.reduce((s,f)=>s+Number(f.amount),0))}</small></h4>`+
   (st.fxOpen?fx.map(f=>`<div class="fr${f.paid?' ok':''}"><span>${esc(f.name)} <em>${f.day?f.day+'일':''}</em></span><b>${Number(f.amount)?won(f.amount):'<em>금액은 눌러서</em>'}</b>${f.paid?'<em>냈음</em>':`<button data-f="${f.id}">냈어요</button>`}</div>`).join(''):'')+'</div>';
}
async function payFixed(id){
  if(st.busy)return;
  const f=fixedList().find(x=>x.id===id);
  let amount=Number(f.amount);
  if(!amount){const v=prompt(f.name+' 금액');amount=Number(String(v||'').replace(/\D/g,''));if(!amount)return}   // 국민연금처럼 0원인 것은 물어서
  st.busy=true;
  try{
    const date=st.month.slice(0,7)===today().slice(0,7)?today():st.month.slice(0,8)+pad(f.day||1);   // 이번 달이면 오늘, 지난달이면 납부일
    const eid=await rpc('fin_add',{p_date:date,p_item:f.item_id,p_amount:amount,p_memo:f.name,p_book:st.book,p_source:'fixed:'+f.id+':'+st.month.slice(0,7)});
    toast(`${f.name} ${won(amount)} 기록`,[['취소',async()=>{await rpc('fin_delete',{p_id:eid,p_restore:false});await loadAll();render();toast('취소했습니다',[],1500)}]],4000);
    await loadAll();render();
  }catch(x){toast('저장 안 됨. ('+x.message+')',[],8000)}
  st.busy=false;
}

/* 달 이동 */
function renderMonth(){
  const [y,m]=st.month.split('-').map(Number);
  document.querySelectorAll('[data-m]').forEach(el=>{el.innerHTML=`<button data-d="-1" aria-label="이전 달">‹</button><span>${y}년 ${m}월</span><button data-d="1" aria-label="다음 달">›</button>`;

/* 내역 */
function renderList(){
  const by={};st.data.entries.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
  const days=Object.keys(by);
  $('#list').innerHTML=days.length?days.map(d=>{
    const dt=new Date(d+'T00:00');
    return `<div class="day">${dt.getMonth()+1}/${dt.getDate()} (${'일월화수목금토'[dt.getDay()]})</div>`+by[d].map(e=>{
      const i=item(e.item_id)||{};const inc=i.kind==='수입';
      const nm=i.area?i.area+' '+i.middle:(i.detail?i.middle+' · '+i.detail:i.middle);
      const sub=isCo()?[e.memo,e.by].filter(Boolean).join(' · '):e.memo;   // 기업은 누가 적었는지도
      return `<button class="ent" data-e="${e.id}"><span>${esc(nm)}<small>${esc(sub)}</small></span><b class="${inc?'inc':''}">${inc?'+':''}${won(e.amount)}</b></button>`}).join('');
  }).join(''):'<p style="text-align:center;color:var(--sub);padding:32px">이 달 기록이 없습니다</p>';
}
$('#list').onclick=e=>{const b=e.target.closest('[data-e]');if(b)editEntry(st.data.entries.find(x=>x.id===b.dataset.e))};
function closeDlg(){$('#dlg').classList.remove('on')}
$('#dlg').onclick=e=>{if(e.target.id==='dlg')closeDlg()};
function editEntry(en){
  const groups={};items().forEach(i=>{const k=i.kind+' · '+(i.area||i.bucket);(groups[k]=groups[k]||[]).push(i)});
  $('#form').innerHTML=`<label>금액<input id="f-a" inputmode="numeric" value="${en.amount}"></label>
   <label>날짜<input id="f-d" type="date" value="${en.date}"></label>
   <label>항목<select id="f-i">${Object.entries(groups).map(([k,a])=>`<optgroup label="${esc(k)}">${a.map(i=>`<option value="${i.id}"${i.id===en.item_id?' selected':''}>${esc(i.detail?i.middle+' · '+i.detail:i.middle)}</option>`).join('')}</optgroup>`).join('')}</select></label>
   <label>메모<input id="f-m" value="${esc(en.memo)}"></label>
   <div class="btns"><button type="button" class="del" id="f-x">지우기</button><button type="button" id="f-c">닫기</button><button class="ok">저장</button></div>`;
  $('#f-c').onclick=closeDlg;
  $('#f-x').onclick=async()=>{closeDlg();await rpc('fin_delete',{p_id:en.id,p_restore:false});await load();
    toast('지웠습니다',[['되돌리기',async()=>{await rpc('fin_delete',{p_id:en.id,p_restore:true});await load()}]])};
  $('#form').onsubmit=async e=>{e.preventDefault();const a=Number($('#f-a').value.replace(/\D/g,''));if(!a){toast('금액을 확인해 주세요',[],1500);return}
    await rpc('fin_update',{p_id:en.id,p_date:$('#f-d').value,p_item:$('#f-i').value,p_amount:a,p_memo:$('#f-m').value});closeDlg();await load();toast('고쳤습니다',[],1500)};
  $('#dlg').classList.add('on');

/* 예산안 (시트와 같은 계산) */
function budgetOf(i,base,d=st.data){
  if(i.rate){const r=Number(i.rate);return Math.round(base/0.87*(r<1?r:r/100)/100)*100}
  return Number(d.budgets[i.id]||0);
}
// 예산 넘은 항목(가정): 실제 > 예산. 넘은 금액 큰 순
function overOf(d){
  if(!d||d.book==='기업')return[];
  const it=d.items.filter(i=>i.kind==='지출'),base=it.filter(i=>!i.rate).reduce((s,i)=>s+Number(d.budgets[i.id]||0),0);
  const act={};d.entries.forEach(e=>act[e.item_id]=(act[e.item_id]||0)+Number(e.amount));
  return it.map(i=>({i,b:budgetOf(i,base,d),a:act[i.id]||0})).filter(x=>x.b>0&&x.a>x.b).map(x=>({...x,over:x.a-x.b})).sort((p,q)=>q.over-p.over);
}
// 폰 알림: 이번 달일 때만. 예산 넘은 것 + 납부일 지난 안 낸 고정 경비
function renderAlert(){
  const el=$('#alert');if(!el)return;
  const now=st.month.slice(0,7)===today().slice(0,7);

function renderProfit(){
  const act={};st.data.entries.forEach(e=>act[e.item_id]=(act[e.item_id]||0)+Number(e.amount));
  const sum=f=>items().filter(f).reduce((s,i)=>s+(act[i.id]||0),0);
  const areas=[...new Set(items().filter(i=>i.area).map(i=>i.area))];
  const sales=sum(i=>i.kind==='수입'),cost=sum(i=>i.kind==='지출'&&i.area),common=sum(i=>i.kind==='지출'&&!i.area);
  const row=(name,v,sub='')=>`<div class="ln"><div class="t"><span>${esc(name)}</span><b class="${v<0?'neg':''}">${won(v)}</b></div>${sub?`<div class="t"><em>${sub}</em></div>`:''}</div>`;
  let h=`<div class="sum pl">
    <div class="tile"><small>총 매출</small><b>${won(sales)}</b></div>
    <div class="tile"><small>총 비용 (영역+공통)</small><b>${won(cost+common)}</b></div>
    <div class="tile wide"><small>기업 전체 이익</small><b class="${sales-cost-common<0?'neg':''}">${won(sales-cost-common)}</b></div></div>`;
  h+=`<div class="bk pl"><h3>영역별 이익<small>매출 − 재료비 − 인건비</small></h3>`;
  areas.forEach(a=>{const s=sum(i=>i.area===a&&i.kind==='수입'),c=sum(i=>i.area===a&&i.kind==='지출');
    const lcNet=sum(i=>i.area===a&&isLC(i)),lc=lcTax(lcNet);
    h+=row(a,s-c,`매출 ${won(s)} · 비용 ${won(c)}`+(lcNet?`<br>수당 받은 돈 ${won(lcNet)} = 세전 ${won(lc.gross)} − 뗀 세금 3.3% ${won(lc.tax)} (5월 종소세 때 정산)`:''))});
  h+='</div>';
  h+=`<div class="bk pl"><h3>공통 경비<small>${won(common)}</small></h3>`;
  [...new Set(items().filter(i=>i.kind==='지출'&&!i.area).map(i=>i.bucket))].forEach(bk=>{const v=sum(i=>i.kind==='지출'&&!i.area&&i.bucket===bk);if(v)h+=row(bk,v)});
  const unpaid=(st.data.fixed||[]).filter(f=>!f.paid);
  if(unpaid.length)h+=row('아직 안 낸 고정 경비 '+unpaid.length+'건',unpaid.reduce((s,f)=>s+Number(f.amount),0));
  h+='</div>';
  $('#bud').innerHTML=fixedHtml()+h;
}
function renderBudget(){
  if(isCo()){renderProfit();return}
  const it=items().filter(i=>i.kind==='지출');
  const base=it.filter(i=>!i.rate).reduce((s,i)=>s+Number(st.data.budgets[i.id]||0),0);
  const act={};st.data.entries.forEach(e=>act[e.item_id]=(act[e.item_id]||0)+Number(e.amount));
  const inSum=m=>items().filter(i=>i.kind==='수입'&&(m?i.middle===m:i.middle!=='이월')).reduce((s,i)=>s+(act[i.id]||0),0);
  const income=inSum(),carry=inSum('이월');
  const plan=it.reduce((s,i)=>s+budgetOf(i,base),0),spent=it.reduce((s,i)=>s+(act[i.id]||0),0);
  const line=(name,b,a,attr='',cls='')=>{const p=b?Math.min(100,a/b*100):(a?100:0);
    return `<button class="ln ${cls}" ${attr}><div class="t"><span>${esc(name)}</span><em>${won(a)} / ${won(b)}</em></div><div class="bar"><i class="${a>b?'over':''}" style="width:${p}%"></i></div></button>`};
  let h=`<div class="sum">
    <div class="tile"><small>월 총수입</small><b>${won(income)}</b></div>
    <div class="tile"><small>실 지출</small><b>${won(spent)}</b></div>
    <div class="tile"><small>잔액 (이월 ${won(carry)} 포함)</small><b>${won(carry+income-spent)}</b></div>
    <div class="tile"><small>예상 지출</small><b>${won(plan)}</b></div>
    <div class="tile wide"><small>믿음으로 구할 금액</small><b>${won(plan-income-carry)}</b></div></div>`;
  [...new Set(it.map(i=>i.bucket))].forEach(bk=>{
    const a=it.filter(i=>i.bucket===bk);
    const sb=a.reduce((s,i)=>s+budgetOf(i,base),0),sa=a.reduce((s,i)=>s+(act[i.id]||0),0);
    h+=`<div class="bk"><h3>${esc(bk)}<small>${won(sa)} / ${won(sb)}</small></h3>`;
    [...new Set(a.map(i=>i.middle))].forEach(m=>{
      const sub=a.filter(i=>i.middle===m);
      if(sub.length===1&&!sub[0].detail){const i=sub[0];h+=line(m,budgetOf(i,base),act[i.id]||0,`data-b="${i.id}"`);return}
      const mb=sub.reduce((s,i)=>s+budgetOf(i,base),0),ma=sub.reduce((s,i)=>s+(act[i.id]||0),0);
      h+=line((st.open[m]?'▾ ':'▸ ')+m,mb,ma,`data-o="${esc(m)}"`);
      if(st.open[m])sub.forEach(i=>h+=line(i.detail,budgetOf(i,base),act[i.id]||0,`data-b="${i.id}"`,'sub'));
    });
    h+='</div>';
  });
  $('#bud').innerHTML=fixedHtml()+h;
}

/* PC 대시보드: 이번 달 한눈에 + 12달 추이 + 분류별 6달 표 + 큰 지출 (2026-11-06 룡: PC = 대시보드·통계) */
F.hist={};
const monthsBack=(m,n)=>{const [y,mm]=m.split('-').map(Number);return [...Array(n)].map((_,k)=>ymd(new Date(y,mm-1-(n-1-k),1)))};
async function histOf(book,m){
  const k=book+'|'+m;
  if(m===st.month&&F.qd[book])return F.hist[k]=F.qd[book];
  if(!F.hist[k])F.hist[k]=await rpc('fin_load',{p_month:m,p_book:book});

}
// 한 달 숫자: 가정은 이월 뺀 수입·지출, 기업은 매출·비용(오레진 수당 포함)
function monthNums(d){
  const it={};d.items.forEach(i=>it[i.id]=i);
  let inc=0,out=0,carry=0,lc=0;
  d.entries.forEach(e=>{const i=it[e.item_id];if(!i)return;const a=Number(e.amount);
    if(i.kind==='수입'){if(i.middle==='이월')carry+=a;else inc+=a;if(isLC(i))lc+=a}else out+=a});
  return{inc,out,carry,lc};
}
const mLbl=m=>Number(m.slice(5,7))+'월';
const pct=(a,b)=>b?Math.round((a-b)/b*100):null;
function delta(a,b,badUp){const p=pct(a,b);if(p===null)return '<em>지난달 기록 없음</em>';
  const cls=p===0?'':(p>0)===badUp?'up':'dn';return `<em class="${cls}">지난달보다 ${p>0?'▲':'▼'} ${Math.abs(p)}%</em>`}
function barChart(ms,nums){
  const W=720,H=220,P=40,max=Math.max(1,...nums.flatMap(n=>[n.inc,n.out]));
  const bw=(W-P)/ms.length,y=v=>H-20-(H-34)*v/max;
  const tick=[0,.5,1].map(t=>`<line x1="${P}" x2="${W}" y1="${y(max*t)}" y2="${y(max*t)}" stroke="var(--line)"/><text x="${P-4}" y="${y(max*t)+4}" text-anchor="end">${Math.round(max*t/10000).toLocaleString('ko-KR')}만</text>`).join('');
  const bars=ms.map((m,k)=>{const x=P+k*bw,n=nums[k],w=Math.max(4,bw/2-5);
    return `<g><title>${mLbl(m)} 수입 ${won(n.inc)} · 지출 ${won(n.out)}</title>
      <rect x="${x+3}" y="${y(n.inc)}" width="${w}" height="${H-20-y(n.inc)}" rx="2" fill="var(--in)"/>
      <rect x="${x+3+w+2}" y="${y(n.out)}" width="${w}" height="${H-20-y(n.out)}" rx="2" fill="#9aa59f"/>
      <text x="${x+bw/2}" y="${H-5}" text-anchor="middle"${m===st.month?' style="fill:var(--ink);font-weight:700"':''}>${mLbl(m)}</text></g>`}).join('');
  return `<div class="lg"><span><i style="background:var(--in)"></i>수입</span><span><i style="background:#9aa59f"></i>지출</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="12달 수입·지출">${tick}${bars}</svg>`;
}
// 분류별 6달 표: 대분류(기업은 영역 · 대분류), 수입·지출 따로
function pivot(ms,ds){
  const rows={};const key=i=>(i.area?i.area+' · ':'')+i.bucket;
  ds.forEach((d,k)=>{const it={};d.items.forEach(i=>it[i.id]=i);
    d.entries.forEach(e=>{const i=it[e.item_id];if(!i||i.middle==='이월')return;
      const rk=i.kind+'|'+key(i);const r=(rows[rk]=rows[rk]||{kind:i.kind,name:key(i),v:Array(ms.length).fill(0)});r.v[k]+=Number(e.amount)})});
  const head=`<thead><tr><th>분류</th>${ms.map(m=>`<th>${mLbl(m)}</th>`).join('')}<th>평균</th></tr></thead>`;
  const tot=v=>v.reduce((s,x)=>s+x,0);
  const tr=(n,v,cls='')=>`<tr class="${cls}"><td>${esc(n)}</td>${v.map(x=>`<td>${x?x.toLocaleString('ko-KR'):'·'}</td>`).join('')}<td class="avg">${Math.round(tot(v)/v.length).toLocaleString('ko-KR')}</td></tr>`;
  const body=['수입','지출'].map(kind=>{const rs=Object.values(rows).filter(r=>r.kind===kind).sort((a,b)=>tot(b.v)-tot(a.v));
    if(!rs.length)return '';
    return tr(kind+' 합계',ms.map((_,k)=>rs.reduce((s,r)=>s+r.v[k],0)),'gh')+rs.map(r=>tr(r.name,r.v)).join('')}).join('');
  return `<div style="overflow:auto"><table class="pv">${head}<tbody>${body}</tbody></table></div>`;
}
const entBtn=(e,it)=>{const i=it[e.item_id]||{};const inc=i.kind==='수입';
  return `<button class="ent" data-e="${e.id}"><span>${esc((i.area?i.area+' ':'')+itemName(i))}<small>${esc(e.date.slice(5).replace('-','/'))} ${esc([e.memo,e.by].filter(Boolean).join(' · '))}</small></span><b class="${inc?'inc':''}">${inc?'+':''}${won(e.amount)}</b></button>`};
async function renderDash(){

      +kpi(yr+'년 이익 (쌓인 것)',ySum(x=>x.inc-x.out),lc?`<em>오레진 수당 ${won(lc)} · 뗀 세금 ${won(t.tax)}</em>`:`<em>${yIdx.length}달 합</em>`);
  }else{
    const it=d.items.filter(i=>i.kind==='지출'),base=it.filter(i=>!i.rate).reduce((s,i)=>s+Number(d.budgets[i.id]||0),0),plan=it.reduce((s,i)=>s+budgetOf(i,base,d),0);
    h+=kpi(mLbl(month)+' 수입',n.inc,delta(n.inc,p.inc,false))+kpi(mLbl(month)+' 지출',n.out,delta(n.out,p.out,true))
      +kpi('잔액 (이월 포함)',n.carry+n.inc-n.out,`<em>이월 ${won(n.carry)}</em>`)+kpi('예산 대비 지출',n.out,`<em>예산 ${won(plan)} 중 ${plan?Math.round(n.out/plan*100):0}%</em>`);
  }
  h+=`<div class="dc s8 chart"><h3>12달 수입·지출<small>${mLbl(ms[0])}~${mLbl(month)}</small></h3>${barChart(ms,nums)}</div>`;
  if(co){
    const areas=[...new Set(d.items.filter(i=>i.area).map(i=>i.area))],acc={};
    yIdx.forEach(k=>{const dd=ds[k],it={};dd.items.forEach(i=>it[i.id]=i);
      dd.entries.forEach(e=>{const i=it[e.item_id];if(i&&i.area)acc[i.area]=(acc[i.area]||0)+(i.kind==='수입'?1:-1)*Number(e.amount)})});

  }else{

  h+=`<div class="dc full"><h3>분류별 6달<small>단위 원 · 평균은 6달</small></h3>${pivot(ms.slice(-6),ds.slice(-6))}</div>`;
  const it={};d.items.forEach(i=>it[i.id]=i);
  const big=d.entries.filter(e=>(it[e.item_id]||{}).kind==='지출').sort((a,b)=>b.amount-a.amount).slice(0,8);
  const recent=[...d.entries].sort((a,b)=>String(b.created_at||b.date).localeCompare(String(a.created_at||a.date))).slice(0,8);

  h+=`<div class="dc"><h3>${mLbl(month)} 큰 지출<small>금액 순</small></h3>${big.map(e=>entBtn(e,it)).join('')||none}</div>`;
  h+=`<div class="dc"><h3>최근 기록<small>${mLbl(month)}</small></h3>${recent.map(e=>entBtn(e,it)).join('')||none}</div>`;
  el.innerHTML=h+'</div>';
}

      const r=await fetch(API+'fin_login',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_id:$('#nick').value,p_pw:$('#pw').value})});
      const d=await r.json();
      if(!r.ok||d.error){err.textContent=d.error||'들어가지 못했어요. 다시 해 주세요.';go.disabled=false;return}
      token=d.token;store.set(token);await enter();
    }catch(x){err.textContent='인터넷 연결을 확인해 주세요.';go.disabled=false}};
}
/* ☰ 계정 창. 로그아웃은 이 앱의 모든 기기에서 나간다. 비밀번호를 바꾸면 계정이 같아 모든 기록에서 나간다 */
/* 처음 비밀번호면 바꾸기 전에는 닫히지 않는다(업무·영성·건강 기록과 같음) */
let pwForced=false;
function amView(v){$('#amMain').hidden=v!=='main';$('#amSetView').hidden=v!=='set';$('#pwForm').hidden=v!=='pw'}
function forcePw(){
  if(pwForced)return;pwForced=true;amView('pw');$('#pwForm').reset();$('#pwErr').textContent='';
  $('#amName').textContent=me.name+'님';$('#amClose').hidden=$('#pwBack').hidden=true;$('#pwMust').hidden=false;$('#amBg').hidden=false;
}
function unforcePw(){pwForced=false;$('#amClose').hidden=$('#pwBack').hidden=false;$('#pwMust').hidden=true}
$('#menuBtn').onclick=()=>{amView('main');$('#amName').textContent=me.name+'님';$('#amBg').hidden=false};
$('#amClose').onclick=()=>{$('#amBg').hidden=true};
$('#amBg').onclick=e=>{if(e.target.id==='amBg'&&!pwForced)$('#amBg').hidden=true};
$('#amSet').onclick=()=>amView('set');
$('#amBack').onclick=()=>amView('main');
$('#pwBack').onclick=()=>amView('set');
$('#amPw').onclick=()=>{$('#pwForm').reset();$('#pwErr').textContent='';amView('pw')};
$('#amOut').onclick=async()=>{await rpc('fin_logout_all',{}).catch(()=>{});logout()};
$('#pwForm').onsubmit=async e=>{
  e.preventDefault();$('#pwErr').textContent='';
  if($('#pwNew').value!==$('#pwNew2').value){$('#pwErr').textContent='새 비밀번호 두 칸이 서로 달라요.';return}
  const btn=$('#pwGo');btn.disabled=true;
  try{
    const d=await rpc('fin_change_password',{p_current:$('#pwNow').value,p_next:$('#pwNew').value});
    if(d.error){$('#pwErr').textContent=d.error;return}
    logout();$('#err').textContent='비밀번호를 바꿨어요. 모든 기기에서 나갔어요. 새 비밀번호로 들어와 주세요.';
  }catch(x){$('#pwErr').textContent=x.message}finally{btn.disabled=false}
};
// 앱을 다시 열 때 최신으로
window.refresh=()=>{if(st.data&&!st.busy)loadAll().then(render).catch(()=>{})};
</script>
