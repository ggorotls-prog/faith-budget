// 재정 기록 폰 기능 원본 한 벌(2026-11-15 룡 「기록 앱은 동일, 라이프 RPG는 비추는 창」·「하나로 모으자」).
// 재정 기록 앱(app)과 라이프 RPG(👛 지갑)가 이 모듈을 같이 쓴다. 라이프 RPG는 빌드 때 이 저장소를 받아 이 폴더를 가져다 쓴다.
// 여기를 고치면 두 앱이 다음 빌드부터 같이 바뀐다.
plugins {
    id 'com.android.library'
}

android {
    namespace 'app.recordkit.fin'
    compileSdk 35

    defaultConfig {
        minSdk 29
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 알림 글자 읽기(FinParse) 시험. 앱에는 안 들어간다
    testImplementation 'junit:junit:4.13.2'
}
